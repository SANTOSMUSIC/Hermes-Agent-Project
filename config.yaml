plugins:
  enabled:
    - agency-agents-router
_config_version: 49
model:
  default: "COMBOZZ"
  provider: "custom"
  base_url: "http://127.0.0.1:20128/v1"
  api_key: ${OPENAI_API_KEY}
telemetry:
  shared_metrics:
    enabled: false
    send: false
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
  - provider: gemini
    model: gemini-3.5-flash-lite
auxiliary:
  title_generation:
    model_upgrade_enabled: false
approvals:
  destructive_slash_confirm: false
delegation:
  model: "COMBORSSSSZZZZZ"
  provider: "custom"
  base_url: "http://127.0.0.1:20128/v1"
  api_key: ${OPENAI_API_KEY}
